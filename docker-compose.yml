services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: docker_password
      MYSQL_DATABASE: camara_deputados
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/camara_db.sql:/docker-entrypoint-initdb.d/camara_db.sql
    networks:
      - camara_network

  app:
    build: .
    container_name: camara_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: docker_password
      DB_NAME: camara_deputados
    depends_on:
      - db
    networks:
      - camara_network
  nginx:
    image: nginx:latest
    container_name: camara_nginx
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - camara_network

networks:
  camara_network:
    driver: bridge